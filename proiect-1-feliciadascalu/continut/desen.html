<svg width="100%" height="100vh" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
        <linearGradient id="gradCer" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a75ff; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#80b3ff; stop-opacity:1" />
        </linearGradient>

        <linearGradient id="gradIarba" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2ecc71; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#27ae60; stop-opacity:1" />
        </linearGradient>

        <g id="oita_detaliata" transform="scale(0.6)">
            <rect x="-25" y="15" width="8" height="35" rx="2" fill="#333" />
            <rect x="-5" y="18" width="8" height="35" rx="2" fill="#333" />
            <rect x="15" y="15" width="8" height="35" rx="2" fill="#333" />
            <rect x="35" y="18" width="8" height="35" rx="2" fill="#333" />

            <circle cx="0" cy="0" r="30" fill="white" />
            <circle cx="25" cy="-10" r="25" fill="white" />
            <circle cx="50" cy="0" r="30" fill="white" />
            <circle cx="25" cy="15" r="25" fill="white" />
            <circle cx="25" cy="0" r="35" fill="white" /> 
            
            <ellipse cx="75" cy="-5" rx="18" ry="22" fill="#222" />
            
            <ellipse cx="62" cy="-15" rx="5" ry="10" fill="#222" transform="rotate(-30 62 -15)" />
            <ellipse cx="88" cy="-15" rx="5" ry="10" fill="#222" transform="rotate(30 88 -15)" />

            <circle cx="78" cy="-10" r="3" fill="white" />
        </g>
    </defs>

    <rect width="1000" height="400" fill="url(#gradCer)" />

    <polygon points="0,400 200,150 400,400" fill="#7f8c8d" />
    <polygon points="250,400 500,100 750,400" fill="#95a5a6" />
    <polygon points="600,400 850,200 1100,400" fill="#7f8c8d" />

    <circle cx="900" cy="80" r="40" fill="yellow">
        <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" />
        <animate attributeName="fill" values="#f1c40f;#f39c12;#f1c40f" dur="3s" repeatCount="indefinite" />
    </circle>

    <rect y="400" width="1000" height="200" fill="url(#gradIarba)" />

    <line x1="0" y1="420" x2="1000" y2="420" stroke="#5d4037" stroke-width="5" />
    <line x1="0" y1="450" x2="1000" y2="450" stroke="#5d4037" stroke-width="5" />

    <text x="500" y="350" font-family="Arial" font-size="30" fill="white" text-anchor="middle" style="font-weight: bold; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));">
        Ferma lui Sam
    </text>

    <use href="#oita_detaliata" y="430">
        <animateTransform attributeName="transform" type="translate" from="-150 0" to="1150 0" dur="20s" repeatCount="indefinite" />
    </use>

    <use href="#oita_detaliata" y="470">
        <animateTransform attributeName="transform" type="translate" from="-300 0" to="1150 0" dur="25s" repeatCount="indefinite" />
    </use>

    <use href="#oita_detaliata" y="510">
        <animateTransform attributeName="transform" type="translate" from="-100 0" to="1150 0" dur="18s" repeatCount="indefinite" />
    </use>

</svg>
