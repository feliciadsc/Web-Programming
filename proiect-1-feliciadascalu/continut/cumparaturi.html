<section>
    <h2>Listă de Cumpărături</h2>
    <form id="form-cumparaturi">
        <label for="nume">Produs:</label>
        <input type="text" id="nume" required>
        
        <label for="cantitate">Cantitate:</label>
        <input type="text" id="cantitate" required>
        
        <button type="button" id="btn-adauga">Adaugă</button>
    </form>

    <table border="1" id="tabel-cumparaturi" style="margin-top: 20px; width: 100%;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nume</th>
                <th>Cantitate</th>
            </tr>
        </thead>
        <tbody id="lista-produse">
            </tbody>
    </table>
</section>
